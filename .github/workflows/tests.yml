name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: kv-cache experiment --requests 200 --output results/smoke
  inference-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[serving]'
      - run: python -m unittest discover -s tests -v
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU serving image
        run: docker build -f Dockerfile.cpu -t kv-serving:test .
      - name: Start authenticated tiny-model container
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kv-secrets"
          python -c 'import secrets; from pathlib import Path; import os; Path(os.environ["RUNNER_TEMP"],"kv-secrets","api_key").write_text(secrets.token_urlsafe(32))'
          chmod 755 "$RUNNER_TEMP/kv-secrets"
          chmod 644 "$RUNNER_TEMP/kv-secrets/api_key"
          docker run -d --name kv-test -p 127.0.0.1:8000:8000 \
            -v "$RUNNER_TEMP/kv-secrets/api_key:/run/secrets/api_key:ro" \
            -e KV_API_KEY_FILE=/run/secrets/api_key -e KV_TINY=1 kv-serving:test
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 2
          done
          docker logs kv-test
          exit 1
      - name: Verify authentication, reuse and metrics
        shell: bash
        run: |
          export KV_API_KEY="$(cat "$RUNNER_TEMP/kv-secrets/api_key")"
          python scripts/check_deployment.py http://127.0.0.1:8000
      - name: Save container evidence
        if: always()
        run: |
          mkdir -p results
          docker logs kv-test > results/container.log 2>&1 || true
          docker inspect kv-test > results/container-inspect.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-validation
          path: results/
