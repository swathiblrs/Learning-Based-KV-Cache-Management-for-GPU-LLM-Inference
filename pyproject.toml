[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-kv-cache"
version = "0.1.0"
description = "Reproducible learned prefix-cache eviction experiments for LLM inference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "transformers>=4.57,<5"]
serving = ["torch>=2.6,<3", "transformers>=4.57,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "prometheus-client>=0.21,<1", "httpx>=0.27,<1"]

[project.scripts]
kv-cache = "kv_cache.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
